<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diabetes Risk Assessment</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    <div class="mb-6 border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-sky-400">Diabetes Risk Predictor</h1>
      <p class="text-slate-400 text-sm mt-1">Enter patient clinical metrics to generate real-time SVM classification.</p>
    </div>

    <form id="predictForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Pregnancies</label>
        <input type="number" id="pregnancies" step="1" value="2" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Glucose Level</label>
        <input type="number" id="glucose" step="any" value="120" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Blood Pressure (mm Hg)</label>
        <input type="number" id="blood_pressure" step="any" value="70" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Skin Thickness (mm)</label>
        <input type="number" id="skin_thickness" step="any" value="20" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Insulin Level (IU/mL)</label>
        <input type="number" id="insulin" step="any" value="80" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">BMI</label>
        <input type="number" id="bmi" step="any" value="26.5" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Pedigree Function</label>
        <input type="number" id="pedigree_function" step="0.01" value="0.45" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Age</label>
        <input type="number" id="age" step="1" value="33" required class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500">
      </div>

      <div class="sm:col-span-2 mt-2">
        <button type="submit" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-600 active:scale-[0.99] transition font-semibold text-white py-3 rounded-lg shadow-md">
          Run Prediction
        </button>
      </div>
    </form>

    <div id="resultBox" class="mt-6 hidden p-4 rounded-xl border"></div>
  </div>

  <script>
    const form = document.getElementById('predictForm');
    const resultBox = document.getElementById('resultBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = "Processing...";

      const payload = {
        pregnancies: parseFloat(document.getElementById('pregnancies').value),
        glucose: parseFloat(document.getElementById('glucose').value),
        blood_pressure: parseFloat(document.getElementById('blood_pressure').value),
        skin_thickness: parseFloat(document.getElementById('skin_thickness').value),
        insulin: parseFloat(document.getElementById('insulin').value),
        bmi: parseFloat(document.getElementById('bmi').value),
        pedigree_function: parseFloat(document.getElementById('pedigree_function').value),
        age: parseFloat(document.getElementById('age').value),
      };

      try {
        const res = await fetch('http://localhost:8000/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        resultBox.classList.remove('hidden', 'bg-rose-950/60', 'border-rose-700', 'bg-emerald-950/60', 'border-emerald-700', 'bg-amber-950/60', 'border-amber-700');

        if (data.prediction === 1) {
          resultBox.classList.add('bg-rose-950/60', 'border-rose-700');
          resultBox.innerHTML = `
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-lg font-bold text-rose-400">Result: Diabetic</h3>
                <p class="text-sm text-rose-200 mt-1">Confidence: <span class="font-bold">${data.confidence}%</span></p>
              </div>
              <span class="px-3 py-1 text-xs font-bold rounded-full bg-rose-900 text-rose-200 border border-rose-600 uppercase tracking-wider">High Risk</span>
            </div>
          `;
        } else {
          resultBox.classList.add('bg-emerald-950/60', 'border-emerald-700');
          resultBox.innerHTML = `
            <div class="flex items-center justify-between">
              <div>
                <h3 class="text-lg font-bold text-emerald-400">Result: Non-Diabetic</h3>
                <p class="text-sm text-emerald-200 mt-1">Confidence: <span class="font-bold">${data.confidence}%</span></p>
              </div>
              <span class="px-3 py-1 text-xs font-bold rounded-full bg-emerald-900 text-emerald-200 border border-emerald-600 uppercase tracking-wider">Low Risk</span>
            </div>
          `;
        }
      } catch (err) {
        resultBox.classList.remove('hidden');
        resultBox.classList.add('bg-amber-950/60', 'border-amber-700');
        resultBox.innerHTML = `<p class="text-amber-300 text-sm">Failed to connect to backend at http://localhost:8000/predict.</p>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Run Prediction";
      }
    });
  </script>
</body>
</html>
