services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diabetes-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diabetes-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge